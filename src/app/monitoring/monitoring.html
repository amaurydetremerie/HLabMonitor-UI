<div class="p-4 md:p-6 space-y-4">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="text-xl font-semibold">Monitoring results</h1>
      <p class="text-sm text-surface-500">Filtrer et parcourir les checks.</p>
    </div>

    <div class="flex gap-2">
      <p-button
        label="Clear"
        icon="pi pi-refresh"
        (onClick)="clearFilters()"
        styleClass="rounded-xl border-0 bg-blue-200 text-slate-900 hover:bg-blue-300
              dark:bg-blue-950/60 dark:text-slate-100 dark:hover:bg-blue-950/10">
      </p-button>
    </div>
  </div>

  <!-- Filters -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-3">
    <div class="lg:col-span-2">
      <label class="block text-sm mb-1" id="datepicker-from-filter-label" for="datepicker-from-filter">From</label>
      <p-datepicker
        [ariaLabelledBy]="'datepicker-from-filter-label'"
        inputId="datepicker-from-filter"
        [ngModel]="fromDate()"
        (ngModelChange)="fromDate.set($event)"
        [showTime]="true"
        hourFormat="24"
        [showSeconds]="true"
        [showIcon]="true"
        [showButtonBar]="true"
        [maxDate]="toDate() ?? undefined"
        class="w-full">
      </p-datepicker>
    </div>

    <div class="lg:col-span-2">
      <label class="block text-sm mb-1" id="datepicker-to-filter-label" for="datepicker-to-filter">To</label>
      <p-datepicker
        [ariaLabelledBy]="'datepicker-to-filter-label'"
        inputId="datepicker-to-filter"
        [ngModel]="toDate()"
        (ngModelChange)="toDate.set($event)"
        [showTime]="true"
        hourFormat="24"
        [showSeconds]="true"
        [showIcon]="true"
        [showButtonBar]="true"
        [minDate]="fromDate() ?? undefined"
        class="w-full">
      </p-datepicker>
    </div>

    <div class="lg:col-span-4">
      <label class="block text-sm mb-1" id="multiSelect-target-filter-label" for="multiSelect-target-filter">Targets</label>
      <p-multiSelect
        [ariaLabelledBy]="'multiSelect-target-filter-label'"
        inputId="multiSelect-target-filter"
        [options]="targetOptions()"
        [ngModel]="selectedTargets()"
        (ngModelChange)="selectedTargets.set($event)"
        optionLabel="id"
        display="chip"
        class="w-full">
      </p-multiSelect>
    </div>

    <div class="lg:col-span-2">
      <label class="block text-sm mb-1" id="multiSelect-type-filter-label" for="multiSelect-type-filter">Type</label>
      <p-multiSelect
        [ariaLabelledBy]="'multiSelect-type-filter-label'"
        inputId="multiSelect-type-filter"
        [options]="typeOptions()"
        [ngModel]="selectedTypes()"
        (ngModelChange)="selectedTypes.set($event)"
        display="chip"
        class="w-full">
      </p-multiSelect>
    </div>

    <div class="lg:col-span-2">
      <label class="block text-sm mb-1" id="multiSelect-result-filter-label" for="multiSelect-result-filter">Résultat</label>
      <p-multiSelect
        [ariaLabelledBy]="'multiSelect-result-filter-label'"
        inputId="multiSelect-result-filter"
        [options]="resultOptions()"
        [ngModel]="selectedResults()"
        (ngModelChange)="selectedResults.set($event)"
        display="chip"
        class="w-full">
      </p-multiSelect>
    </div>
  </div>

  <!-- Table -->
  <p-table
    [value]="results()"
    [lazy]="true"
    (onLazyLoad)="onLazyLoad($event)"
    [paginator]="true"
    [rows]="rows()"
    [first]="first()"
    [totalRecords]="totalElements()"
    [loading]="loading()"
    [rowsPerPageOptions]="[10,25,50,100]"
    class="w-full"
  >
    <ng-template pTemplate="header">
      <tr>
        <th scope="col">Target</th>
        <th scope="col">Result</th>
        <th scope="col">Checked at</th>
        <th scope="col">Message</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr>
        <td class="font-mono text-sm">{{ row.id?.id }}</td>

        <td>
          <div class="flex items-center gap-3 rounded-xl border p-4"
               [ngClass]="{
                'border-green-200 bg-green-50 dark:border-green-900/40 dark:bg-green-950/30': row.result === 'SUCCESS',
                'border-yellow-200 bg-yellow-50 dark:border-yellow-700/40 dark:bg-yellow-800/30': row.result === 'WARNING',
                'border-orange-200 bg-orange-50 dark:border-orange-900/40 dark:bg-orange-950/30': row.result === 'FAILURE',
                'border-red-400 bg-red-200 dark:border-red-900/40 dark:bg-red-950/30': row.result === 'ERROR',
               }">
            <div class="h-7 w-7 rounded-lg grid place-items-center bg-black/5 dark:bg-white/10">
              <i class="text-lg pi"
                 [ngClass]="{
                  'pi-check': row.result === 'SUCCESS',
                  'pi-exclamation-triangle': row.result === 'WARNING',
                  'pi-times': row.result === 'FAILURE',
                  'pi-bolt': row.result === 'ERROR'
                 }"></i>
            </div>

            <div class="min-w-0">
              <div class="text-sm text-surface-600 dark:text-surface-300 truncate">{{ row.result }}</div>
            </div>
          </div>
        </td>

        <td class="text-sm">
          {{ row.checkedAt | date:'yyyy-MM-dd HH:mm:ss' }}
        </td>

        <td class="text-sm whitespace-normal break-words max-w-[60ch]">
          {{ row.message }}
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center py-8 text-surface-500">
          Aucun résultat.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
